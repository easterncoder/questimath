<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuestiMath - Master Your Math Skills</title>
  <meta name="description" content="A gamified math practice app with levels, streaks, badges, cloud sync, and offline play.">
  
  <!-- PWA Meta Tags & Manifest Link -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#090d16">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="QuestiMath">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React and ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .heading-font {
      font-family: 'Space Grotesk', sans-serif;
    }
    .active-scale:active {
      transform: scale(0.95);
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .animate-shake {
      animation: shake 0.2s ease-in-out 0s 2;
    }
    @keyframes bounce-subtle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .animate-bounce-subtle {
      animation: bounce-subtle 2s infinite;
    }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>

  <script>
    /* Register the service worker for offline play and installation support. */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker registered successfully!', reg))
          .catch(err => console.error('Service Worker registration failed:', err));
      });
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-indigo-500 selection:text-white font-sans">

  <div id="root"></div>

  <!-- Firebase CDN Bootstrapper -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = typeof __firebase_config !== 'undefined' 
      ? JSON.parse(__firebase_config) 
      : {
          apiKey: "",
          authDomain: "placeholder-auth.firebaseapp.com",
          projectId: "placeholder-project",
          storageBucket: "placeholder-project.appspot.com",
          messagingSenderId: "000000000000",
          appId: "1:000000000000:web:0000000000000000"
        };

    let app, auth, db;
    let fallbackMode = false;
    
    try {
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
      enableIndexedDbPersistence(db).catch(error => {
        console.warn("Firestore offline persistence unavailable. Local progress storage remains active.", error);
      });
    } catch (e) {
      console.warn("Firebase initialization skipped or failed. Falling back to local offline-only save.", e);
      fallbackMode = true;
    }

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'questimath-app';

    // Export Core Config Globals for React component wrapper
    window.FirebaseCore = {
      auth,
      db,
      appId,
      signInWithCustomToken,
      signInAnonymously,
      onAuthStateChanged,
      doc,
      setDoc,
      getDoc,
      onSnapshot,
      enableIndexedDbPersistence,
      fallbackMode
    };
  </script>

  <!-- React Application Core -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const APP_VERSION = '0.2.7';
    const LOCAL_PROGRESS_KEY = 'questimath.progress.v1';
    const AUTO_CONTINUE_SECONDS = 5;

    /*
     * Returns the default progress shape used by local and cloud storage.
     */
    function getDefaultProgress() {
      return {
        level: 1,
        xp: 0,
        highestStreak: 0,
        solvedHistory: { total: 0, correct: 0, wrong: 0, ops: {} },
        badgeList: null
      };
    }

    /*
     * Loads saved progress from local storage when cloud sync is unavailable.
     */
    function loadLocalProgress() {
      try {
        const rawProgress = localStorage.getItem(LOCAL_PROGRESS_KEY);

        if (!rawProgress) {
          return getDefaultProgress();
        }

        return {
          ...getDefaultProgress(),
          ...JSON.parse(rawProgress)
        };
      } catch (error) {
        console.warn("Local progress could not be loaded.", error);
        return getDefaultProgress();
      }
    }

    /*
     * Saves progress locally so installed offline sessions keep player state.
     */
    function saveLocalProgress(progress) {
      try {
        localStorage.setItem(LOCAL_PROGRESS_KEY, JSON.stringify({
          ...progress,
          updatedAt: new Date().toISOString()
        }));
      } catch (error) {
        console.warn("Local progress could not be saved.", error);
      }
    }

    /* Zero-asset browser audio synthesis. */
    const playSound = (type, isMuted) => {
      if (isMuted) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;

        if (type === 'correct') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.12);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start();
          osc.stop(now + 0.35);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(130.81, now + 0.25);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.start();
          osc.stop(now + 0.3);
        } else if (type === 'levelUp') {
          const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const oscN = ctx.createOscillator();
            const gainN = ctx.createGain();
            oscN.connect(gainN);
            gainN.connect(ctx.destination);
            oscN.type = 'sine';
            oscN.frequency.setValueAtTime(freq, now + idx * 0.08);
            gainN.gain.setValueAtTime(0.04, now + idx * 0.08);
            gainN.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.5);
            oscN.start(now + idx * 0.08);
            oscN.stop(now + idx * 0.08 + 0.5);
          });
        } else if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          gain.gain.setValueAtTime(0.03, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          osc.start();
          osc.stop(now + 0.07);
        }
      } catch (e) {
        console.warn("Audio context not allowed or unsupported:", e);
      }
    };

    const RANKS = [
      { level: 1, name: "Arithmetic Squire", color: "from-amber-400 to-orange-500", desc: "Embarking on the math odyssey" },
      { level: 2, name: "Number Warrior", color: "from-teal-400 to-emerald-500", desc: "Commanding multi-digit forces" },
      { level: 3, name: "Equation Knight", color: "from-blue-400 to-indigo-500", desc: "Slaying the carrying & borrowing beasts" },
      { level: 4, name: "Math Sorcerer", color: "from-fuchsia-400 to-purple-600", desc: "Unlocking advanced calculation spells" },
      { level: 5, name: "Grandmaster Alchemist", color: "from-rose-400 to-rose-600", desc: "Master of ultimate arithmetic magic" }
    ];

    const BADGES = [
      { id: 'first_step', title: 'First Spark ⚡', desc: 'Solved your very first QuestiMath challenge correctly!', unlocked: false },
      { id: 'streak_5', title: 'On Fire! 🔥', desc: 'Reached a streak of 5 correct answers.', unlocked: false },
      { id: 'streak_15', title: 'Absolute Zenith 🚀', desc: 'Reached a mega streak of 15 correct answers.', unlocked: false },
      { id: 'speedy', title: 'Speed Demon ⚡', desc: 'Solved a complex math puzzle in under 2.5 seconds!', unlocked: false },
      { id: 'all_ops', title: 'All-Rounder 🧩', desc: 'Solved addition, subtraction, multiplication & division.', unlocked: false },
      { id: 'half_century', title: 'Centurion Rookie 💯', desc: 'Got 50 correct answers in total.', unlocked: false },
      { id: 'max_level', title: 'Ultimate Sage 👑', desc: 'Reached the prestigious Level 5 rank.', unlocked: false }
    ];

    function App() {
      const initialProgressRef = useRef(null);

      if (initialProgressRef.current === null) {
        initialProgressRef.current = loadLocalProgress();
      }

      const [user, setUser] = useState(null);
      const [syncStatus, setSyncStatus] = useState('offline');
      const [loadingProgress, setLoadingProgress] = useState(true);

      const [gameMode, setGameMode] = useState('adventure');
      const [level, setLevel] = useState(initialProgressRef.current.level);
      const [xp, setXp] = useState(initialProgressRef.current.xp);
      const [streak, setStreak] = useState(0);
      const [highestStreak, setHighestStreak] = useState(initialProgressRef.current.highestStreak);
      const [currentProblem, setCurrentProblem] = useState(null);
      const [userAnswer, setUserAnswer] = useState('');
      const [feedback, setFeedback] = useState(null);
      const [continueCountdown, setContinueCountdown] = useState(null);
      const [activePadKey, setActivePadKey] = useState(null);
      const [isMuted, setIsMuted] = useState(false);
      const [solvedHistory, setSolvedHistory] = useState(initialProgressRef.current.solvedHistory);
      const [badgeList, setBadgeList] = useState(initialProgressRef.current.badgeList || BADGES);
      
      const [practiceOps, setPracticeOps] = useState({ '+': true, '-': true, '*': false, '/': false });
      const [practiceLevel, setPracticeLevel] = useState(1);

      const [shakeActive, setShakeActive] = useState(false);
      const canvasRef = useRef(null);
      const inputRef = useRef(null);
      const keypadFlashTimeoutRef = useRef(null);

      const [dailyGoalMax] = useState(150);

      const focusAnswerInput = () => {
        window.requestAnimationFrame(() => {
          const answerInput = inputRef.current;

          if (!answerInput || answerInput.disabled) {
            return;
          }

          answerInput.focus({ preventScroll: true });
        });
      };

      const handleAnswerInput = (value) => {
        if (feedback && feedback.status) return;

        playSound('click', isMuted);
        setActivePadKey(value);
        window.clearTimeout(keypadFlashTimeoutRef.current);
        keypadFlashTimeoutRef.current = window.setTimeout(() => setActivePadKey(null), 120);

        if (value === 'BACKSPACE') {
          setUserAnswer(prev => prev.slice(0, -1));
          return;
        }

        setUserAnswer(prev => prev + value);
      };

      useEffect(() => {
        return () => window.clearTimeout(keypadFlashTimeoutRef.current);
      }, []);

      useEffect(() => {
        if (currentProblem && !feedback?.status) {
          focusAnswerInput();
        }
      }, [currentProblem, feedback]);

      /*
       * Firebase authentication hook.
       */
      useEffect(() => {
        const core = window.FirebaseCore;
        if (!core || core.fallbackMode) {
          setLoadingProgress(false);
          setSyncStatus('offline');
          return;
        }

        const { auth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } = core;
        setSyncStatus('connecting');

        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (err) {
            console.error("Firebase custom login failed, trying anonymous auth...", err);
            try {
              await signInAnonymously(auth);
            } catch (anonErr) {
              console.error("Anonymous authentication failed completely:", anonErr);
              setSyncStatus('error');
              setLoadingProgress(false);
            }
          }
        };

        initAuth();

        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
          setUser(currentUser);
          if (currentUser) {
            setSyncStatus('synced');
          } else {
            setSyncStatus('offline');
          }
        });

        return () => unsubscribe();
      }, []);

      /*
       * Realtime cloud sync. Cloud progress is mirrored locally for offline launches.
       */
      useEffect(() => {
        if (!user) return;
        const core = window.FirebaseCore;
        if (!core || core.fallbackMode) return;

        const { db, appId, doc, onSnapshot } = core;
        setLoadingProgress(true);

        const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'progress', 'stats');

        const unsubscribe = onSnapshot(docRef, (docSnap) => {
          if (docSnap.exists()) {
            const data = docSnap.data();
            if (data.level) setLevel(data.level);
            if (data.xp !== undefined) setXp(data.xp);
            if (data.highestStreak !== undefined) setHighestStreak(data.highestStreak);
            if (data.solvedHistory) setSolvedHistory(data.solvedHistory);
            if (Array.isArray(data.badgeList)) setBadgeList(data.badgeList);
            saveLocalProgress({
              level: data.level || level,
              xp: data.xp !== undefined ? data.xp : xp,
              highestStreak: data.highestStreak !== undefined ? data.highestStreak : highestStreak,
              solvedHistory: data.solvedHistory || solvedHistory,
              badgeList: Array.isArray(data.badgeList) ? data.badgeList : badgeList
            });
            setSyncStatus('synced');
          } else {
            console.log("No cloud data. Local defaults applied.");
          }
          setLoadingProgress(false);
        }, (err) => {
          console.error("Failed to sync stats in real-time:", err);
          setSyncStatus('error');
          setLoadingProgress(false);
        });

        return () => unsubscribe();
      }, [user]);

      const saveStatsToCloud = async (newLvl, newXp, newMaxStreak, newHistory, newBadgeList = badgeList) => {
        const progress = {
          level: newLvl,
          xp: newXp,
          highestStreak: newMaxStreak,
          solvedHistory: newHistory,
          badgeList: newBadgeList
        };

        saveLocalProgress(progress);

        if (!user) {
          setSyncStatus('offline');
          return;
        }

        const core = window.FirebaseCore;
        if (!core || core.fallbackMode) {
          setSyncStatus('offline');
          return;
        }

        const { db, appId, doc, setDoc } = core;
        setSyncStatus('saving');

        try {
          const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'progress', 'stats');
          await setDoc(docRef, {
            level: newLvl,
            xp: newXp,
            highestStreak: newMaxStreak,
            solvedHistory: newHistory,
            badgeList: newBadgeList,
            updatedAt: new Date().toISOString()
          }, { merge: true });
          
          setSyncStatus('synced');
        } catch (error) {
          console.error("Cloud upload error:", error);
          setSyncStatus('error');
        }
      };

      // Game controller events
      useEffect(() => {
        const handleKeyPress = (e) => {
          if (e.metaKey || e.ctrlKey || e.altKey) {
            return;
          }

          if (/^[0-9]$/.test(e.key)) {
            e.preventDefault();
            handleAnswerInput(e.key);
            return;
          }

          if (e.key === 'Backspace') {
            e.preventDefault();
            handleAnswerInput('BACKSPACE');
            return;
          }

          if (e.key === 'Enter') {
            e.preventDefault();
            if (feedback && feedback.status) {
              nextProblem();
            } else {
              checkAnswer();
            }
          }
        };
        window.addEventListener('keydown', handleKeyPress);
        return () => window.removeEventListener('keydown', handleKeyPress);
      }, [userAnswer, feedback, currentProblem]);

      // Confetti canvas setup
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationId;
        let particles = [];

        const resize = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', resize);
        resize();

        class Particle {
          constructor(x, y) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 8 + 6;
            this.color = `hsl(${Math.random() * 360}, 85%, 60%)`;
            this.speedX = Math.random() * 12 - 6;
            this.speedY = Math.random() * -15 - 5;
            this.gravity = 0.4;
            this.rotation = Math.random() * 360;
            this.rotationSpeed = Math.random() * 10 - 5;
            this.opacity = 1;
          }
          update() {
            this.x += this.speedX;
            this.y += this.speedY;
            this.speedY += this.gravity;
            this.rotation += this.rotationSpeed;
            this.opacity -= 0.015;
          }
          draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate((this.rotation * Math.PI) / 180);
            ctx.globalAlpha = this.opacity;
            ctx.fillStyle = this.color;
            ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
            ctx.restore();
          }
        }

        const triggerConfetti = () => {
          for (let i = 0; i < 80; i++) {
            particles.push(new Particle(canvas.width / 2, canvas.height * 0.7));
          }
        };

        window.triggerMathConfetti = triggerConfetti;

        const animate = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          particles = particles.filter(p => p.opacity > 0);
          particles.forEach(p => {
            p.update();
            p.draw();
          });
          animationId = requestAnimationFrame(animate);
        };
        animate();

        return () => {
          window.removeEventListener('resize', resize);
          cancelAnimationFrame(animationId);
        };
      }, []);

      useEffect(() => {
        if (!loadingProgress) {
          generateNewQuest();
        }
      }, [level, gameMode, practiceOps, practiceLevel, loadingProgress]);

      // Achievement badge validation triggers
      useEffect(() => {
        let updated = false;
        const nextBadges = badgeList.map(b => {
          if (b.unlocked) return b;
          let unlock = false;

          if (b.id === 'first_step' && solvedHistory.correct >= 1) unlock = true;
          if (b.id === 'streak_5' && highestStreak >= 5) unlock = true;
          if (b.id === 'streak_15' && highestStreak >= 15) unlock = true;
          if (b.id === 'half_century' && solvedHistory.correct >= 50) unlock = true;
          if (b.id === 'max_level' && level >= 5) unlock = true;

          const solvedOps = Object.keys(solvedHistory.ops || {});
          if (b.id === 'all_ops' && ['+', '-', '*', '/'].every(op => solvedOps.includes(op))) unlock = true;

          if (unlock) {
            updated = true;
            return { ...b, unlocked: true };
          }
          return b;
        });

        if (updated) {
          setBadgeList(nextBadges);
          saveLocalProgress({
            level,
            xp,
            highestStreak,
            solvedHistory,
            badgeList: nextBadges
          });
        }
      }, [solvedHistory, highestStreak, level]);

      const generateNewQuest = () => {
        setUserAnswer('');
        setFeedback(null);
        
        let targetOps = [];
        let targetLevel = level;

        if (gameMode === 'adventure') {
          if (level === 1) targetOps = ['+', '-'];
          else if (level === 2) targetOps = ['+', '-', '*'];
          else targetOps = ['+', '-', '*', '/'];
        } else {
          targetOps = Object.keys(practiceOps).filter(k => practiceOps[k]);
          if (targetOps.length === 0) targetOps = ['+'];
          targetLevel = practiceLevel;
        }

        const op = targetOps[Math.floor(Math.random() * targetOps.length)];
        let num1 = 0, num2 = 0, answer = 0;

        switch (targetLevel) {
          case 1:
            if (op === '+') {
              num1 = Math.floor(Math.random() * 8) + 2;
              num2 = Math.floor(Math.random() * 8) + 2;
              answer = num1 + num2;
            } else if (op === '-') {
              num1 = Math.floor(Math.random() * 8) + 3;
              num2 = Math.floor(Math.random() * (num1 - 1)) + 1;
              answer = num1 - num2;
            } else if (op === '*') {
              num1 = Math.floor(Math.random() * 4) + 2;
              num2 = Math.floor(Math.random() * 5) + 1;
              answer = num1 * num2;
            } else {
              num2 = Math.floor(Math.random() * 3) + 2;
              answer = Math.floor(Math.random() * 4) + 2;
              num1 = num2 * answer;
            }
            break;

          case 2:
            if (op === '+') {
              num1 = Math.floor(Math.random() * 35) + 11;
              num2 = Math.floor(Math.random() * 8) + 2;
              answer = num1 + num2;
            } else if (op === '-') {
              num1 = Math.floor(Math.random() * 35) + 15; 
              num2 = Math.floor(Math.random() * 12) + 2;
              answer = num1 - num2;
            } else if (op === '*') {
              num1 = Math.floor(Math.random() * 8) + 2;
              num2 = Math.floor(Math.random() * 8) + 2;
              answer = num1 * num2;
            } else {
              num2 = Math.floor(Math.random() * 7) + 3;
              answer = Math.floor(Math.random() * 7) + 2;
              num1 = num2 * answer;
            }
            break;

          case 3:
            if (op === '+') {
              num1 = Math.floor(Math.random() * 70) + 20; 
              num2 = Math.floor(Math.random() * 70) + 20; 
              answer = num1 + num2;
            } else if (op === '-') {
              num1 = Math.floor(Math.random() * 80) + 30;
              num2 = Math.floor(Math.random() * (num1 - 15)) + 10;
              answer = num1 - num2;
            } else if (op === '*') {
              num1 = Math.floor(Math.random() * 4) + 11;
              num2 = Math.floor(Math.random() * 7) + 3;
              answer = num1 * num2;
            } else {
              num2 = Math.floor(Math.random() * 4) + 9;
              answer = Math.floor(Math.random() * 7) + 4;
              num1 = num2 * answer;
            }
            break;

          case 4:
            if (op === '+') {
              num1 = Math.floor(Math.random() * 350) + 100; 
              num2 = Math.floor(Math.random() * 250) + 50; 
              answer = num1 + num2;
            } else if (op === '-') {
              num1 = Math.floor(Math.random() * 450) + 150;
              num2 = Math.floor(Math.random() * 130) + 30;
              answer = num1 - num2;
            } else if (op === '*') {
              num1 = Math.floor(Math.random() * 15) + 11;
              num2 = Math.floor(Math.random() * 10) + 11;
              answer = num1 * num2;
            } else {
              num2 = Math.floor(Math.random() * 10) + 11;
              answer = Math.floor(Math.random() * 10) + 6;
              num1 = num2 * answer;
            }
            break;

          case 5:
            if (op === '+') {
              num1 = Math.floor(Math.random() * 699) + 300; 
              num2 = Math.floor(Math.random() * 699) + 300; 
              answer = num1 + num2;
            } else if (op === '-') {
              num1 = Math.floor(Math.random() * 899) + 100;
              num2 = Math.floor(Math.random() * 800) + 50;
              if (num1 < num2) [num1, num2] = [num2, num1];
              answer = num1 - num2;
            } else if (op === '*') {
              num1 = Math.floor(Math.random() * 40) + 12;
              num2 = Math.floor(Math.random() * 40) + 12;
              answer = num1 * num2;
            } else {
              num2 = Math.floor(Math.random() * 30) + 15;
              answer = Math.floor(Math.random() * 30) + 12;
              num1 = num2 * answer;
            }
            break;
        }

        setCurrentProblem({
          num1,
          num2,
          op,
          answer,
          startTime: Date.now()
        });
      };

      const generateHintExplanation = (num1, num2, op, actualAns) => {
        let text = "";
        if (op === '+') {
          const splitOnes1 = num1 % 10;
          const splitTens1 = num1 - splitOnes1;
          const splitOnes2 = num2 % 10;
          const splitTens2 = num2 - splitOnes2;
          
          text = `Try splitting numbers: Add tens and ones separately!
          • Tens part: ${splitTens1} + ${splitTens2} = ${splitTens1 + splitTens2}
          • Ones part: ${splitOnes1} + ${splitOnes2} = ${splitOnes1 + splitOnes2}
          • Combine them: ${splitTens1 + splitTens2} + ${splitOnes1 + splitOnes2} = ${actualAns}`;
        } else if (op === '-') {
          text = `Try counting upwards from ${num2} to ${num1}:
          • ${num2} + what gets you to ${num1}?
          • Let's bridge to a nice round number first! 
          • ${num2} + ${10 - (num2 % 10)} = ${num2 + (10 - (num2 % 10))}. Use these stepping stones!`;
        } else if (op === '*') {
          text = `Break multiplication into simpler chunks:
          • Can you multiply by easier parts? For example:
          • Split ${num1} × ${num2} into components: 10 × ${num2} and ${num1 - 10} × ${num2}.
          • Or calculate: half of 10 times ${num2}!`;
        } else if (op === '/') {
          text = `Division is just reverse multiplication!
          • Think: What number multiplied by ${num2} equals ${num1}?
          • ${num2} × ? = ${num1}`;
        }
        return text;
      };

      const checkAnswer = () => {
        if (!currentProblem || userAnswer.trim() === '') return;

        const numericAnswer = parseInt(userAnswer);
        const correct = numericAnswer === currentProblem.answer;
        const timeElapsed = (Date.now() - currentProblem.startTime) / 1000;

        const updatedOps = { ...solvedHistory.ops };
        updatedOps[currentProblem.op] = (updatedOps[currentProblem.op] || 0) + (correct ? 1 : 0);

        const newHistory = {
          total: solvedHistory.total + 1,
          correct: solvedHistory.correct + (correct ? 1 : 0),
          wrong: solvedHistory.wrong + (correct ? 0 : 1),
          ops: updatedOps
        };

        let nextLevel = level;
        let nextXp = xp;
        let nextStreak = streak;
        let nextHighestStreak = highestStreak;
        let nextBadgeList = badgeList;

        if (correct) {
          playSound('correct', isMuted);
          const baseXP = 15;
          const streakBonus = Math.min(Math.floor(streak / 3) * 5, 20);
          const earnedXP = baseXP + streakBonus;

          nextXp = xp + earnedXP;
          setXp(nextXp);
          
          nextStreak = streak + 1;
          setStreak(nextStreak);
          
          if (nextStreak > highestStreak) {
            nextHighestStreak = nextStreak;
            setHighestStreak(nextStreak);
          }

          if (timeElapsed < 2.5 && currentProblem.num1 > 10) {
            const tempBadges = badgeList.map(b => ({ ...b }));
            const speedy = tempBadges.find(b => b.id === 'speedy');
            if (speedy) speedy.unlocked = true;
            nextBadgeList = tempBadges;
            setBadgeList(tempBadges);
          }

          let nextLevelMessage = null;
          if (gameMode === 'adventure') {
            const nextLvlGoal = level * 100;
            if (nextXp >= nextLvlGoal && level < 5) {
              nextLevel = level + 1;
              setLevel(nextLevel);
              playSound('levelUp', isMuted);
              window.triggerMathConfetti && window.triggerMathConfetti();
              nextLevelMessage = `🌟 Rank Unlocked: ${RANKS[nextLevel - 1].name}! 👑`;
            }
          }

          setFeedback({
            status: 'success',
            text: nextLevelMessage || `Brilliant! +${earnedXP} XP ${streakBonus > 0 ? `(${streakBonus} Streak Bonus!)` : ''} 🎉`,
            hint: ''
          });

          setSolvedHistory(newHistory);
          saveStatsToCloud(nextLevel, nextXp, nextHighestStreak, newHistory, nextBadgeList);

        } else {
          playSound('wrong', isMuted);
          setStreak(0);
          setShakeActive(true);
          setTimeout(() => setShakeActive(false), 500);

          const hintExplanation = generateHintExplanation(
            currentProblem.num1,
            currentProblem.num2,
            currentProblem.op,
            currentProblem.answer
          );

          setFeedback({
            status: 'error',
            text: `Oops! The correct answer was ${currentProblem.answer}.`,
            hint: hintExplanation
          });

          setSolvedHistory(newHistory);
          saveStatsToCloud(nextLevel, nextXp, nextHighestStreak, newHistory, nextBadgeList);
        }
      };

      const nextProblem = () => {
        playSound('click', isMuted);
        generateNewQuest();
      };

      /*
       * Advances to the next quest after feedback has been visible briefly.
       */
      useEffect(() => {
        if (feedback?.status !== 'success') {
          setContinueCountdown(null);
          return undefined;
        }

        setContinueCountdown(AUTO_CONTINUE_SECONDS);

        const countdownTimer = window.setInterval(() => {
          setContinueCountdown(currentCount => Math.max((currentCount || 1) - 1, 1));
        }, 1000);
        const continueTimer = window.setTimeout(() => {
          nextProblem();
        }, AUTO_CONTINUE_SECONDS * 1000);

        return () => {
          window.clearInterval(countdownTimer);
          window.clearTimeout(continueTimer);
        };
      }, [feedback]);

      const calcProgressPercent = () => {
        if (gameMode !== 'adventure') return 0;
        const currentLvlLimit = (level - 1) * 100;
        const relativeXP = xp - currentLvlLimit;
        return Math.min(Math.max((relativeXP / 100) * 100, 0), 100);
      };

      return (
        <div className="relative min-h-screen flex flex-col justify-between overflow-x-hidden">
          <canvas ref={canvasRef} className="absolute inset-0 pointer-events-none z-50 w-full h-full"></canvas>

          {/* Navigation/Header Bar */}
          <header className="border-b border-slate-800 bg-slate-900/60 backdrop-blur-md px-3 sm:px-6 py-3 sm:py-4 sticky top-0 z-40 transition-all">
            <div className="max-w-6xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-3 md:gap-4">
              
              <div className="flex flex-col min-[360px]:flex-row min-[360px]:items-center justify-between md:justify-start gap-3 md:gap-4">
                <div className="flex items-center gap-3">
                  <img
                    src="./icon-192.png"
                    alt="QuestiMath"
                    className="w-9 h-9 sm:w-10 sm:h-10 rounded-xl shadow-lg shadow-indigo-500/30 shrink-0"
                  />
                  <div>
                    <h1 className="text-lg sm:text-xl font-extrabold tracking-wide heading-font bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">QuestiMath</h1>
                    <p className="text-[9px] sm:text-[10px] text-slate-400 font-semibold tracking-wider uppercase">RPG Learning Simulator</p>
                  </div>
                </div>

                <div className="grid grid-cols-2 min-[360px]:flex bg-slate-950 p-1 rounded-xl border border-slate-800 w-full min-[360px]:w-auto">
                  <button 
                    onClick={() => { setGameMode('adventure'); setStreak(0); }}
                    className={`min-h-11 px-2.5 sm:px-3 py-1.5 rounded-lg text-[11px] sm:text-xs font-bold transition-all ${gameMode === 'adventure' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                  >
                    🏆 Adventure
                  </button>
                  <button 
                    onClick={() => { setGameMode('practice'); setStreak(0); }}
                    className={`min-h-11 px-2.5 sm:px-3 py-1.5 rounded-lg text-[11px] sm:text-xs font-bold transition-all ${gameMode === 'practice' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                  >
                    🎯 Practice
                  </button>
                </div>
              </div>

              {/* Status & Stats Panel */}
              <div className="grid grid-cols-[1fr_auto] min-[360px]:flex min-[360px]:flex-wrap items-center gap-2 sm:gap-4 justify-between md:justify-end">
                <div className="hidden sm:flex items-center gap-1.5 px-3 py-1.5 bg-slate-950 border border-slate-800 rounded-xl text-xs font-bold">
                  {syncStatus === 'connecting' && (
                    <span className="text-amber-400 flex items-center gap-1">
                      <svg className="animate-spin h-3.5 w-3.5 text-amber-400" viewBox="0 0 24 24" fill="none">
                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" />
                      </svg>
                      Connecting...
                    </span>
                  )}
                  {syncStatus === 'synced' && (
                    <span className="text-emerald-400 flex items-center gap-1">
                      <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7" /></svg>
                      Progress Synced
                    </span>
                  )}
                  {syncStatus === 'saving' && (
                    <span className="text-indigo-400 flex items-center gap-1">
                      <svg className="animate-pulse h-3.5 w-3.5 text-indigo-400" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="3" /></svg>
                      Saving Progress...
                    </span>
                  )}
                  {syncStatus === 'offline' && (
                    <span className="text-slate-400 flex items-center gap-1">
                      ☁️ Standard Cache
                    </span>
                  )}
                  {syncStatus === 'error' && (
                    <span className="text-rose-400 flex items-center gap-1">
                      ⚠️ Offline Mode
                    </span>
                  )}
                </div>

                <div className={`flex items-center justify-center gap-2 bg-slate-950 px-3 py-2 min-h-11 rounded-xl border border-orange-500/20 text-orange-400 font-bold text-xs sm:text-sm animate-bounce-subtle ${streak > 0 ? 'ring-1 ring-orange-500/30 shadow-[0_0_15px_rgba(249,115,22,0.1)]' : 'opacity-40'}`}>
                  <span>🔥 Streak: {streak}</span>
                </div>

                {gameMode === 'adventure' && (
                  <div className={`px-3 py-2 min-h-11 rounded-xl text-xs font-bold text-white bg-gradient-to-r ${RANKS[level - 1].color} shadow-md flex items-center justify-center col-span-2 min-[360px]:col-span-1`}>
                    Rank {level}: {RANKS[level - 1].name}
                  </div>
                )}

                <div className="flex items-center justify-center gap-2 bg-slate-950 px-3 py-2 min-h-11 rounded-xl border border-slate-800">
                  <span className="text-xs text-slate-400 font-medium">Total XP:</span>
                  <span className="text-xs sm:text-sm font-extrabold text-indigo-400">{xp}</span>
                </div>

                <button 
                  onClick={() => setIsMuted(!isMuted)} 
                  className="w-11 h-11 flex items-center justify-center rounded-xl bg-slate-950 border border-slate-800 hover:border-indigo-500 hover:text-indigo-400 transition-colors"
                  aria-label="Toggle sound"
                >
                  {isMuted ? (
                    <svg className="w-5 h-5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /></svg>
                  ) : (
                    <svg className="w-5 h-5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /></svg>
                  )}
                </button>
              </div>

            </div>
          </header>

          <main className="max-w-6xl w-full mx-auto px-3 sm:px-6 py-4 sm:py-6 md:py-10 grid grid-cols-1 lg:grid-cols-12 gap-5 sm:gap-6 lg:gap-8 items-start flex-1">
            
            <section className="lg:col-span-8 grid grid-cols-1 gap-5 sm:gap-6">

              {gameMode === 'adventure' && (
                <div className="bg-slate-900/40 border border-slate-800 p-4 rounded-2xl">
                  <div className="flex justify-between items-center gap-3 text-xs text-slate-400 mb-2">
                    <span className="font-semibold uppercase tracking-wider">Adventure Mode Progress</span>
                    <span className="text-right">{calcProgressPercent().toFixed(0)}% to Rank Up</span>
                  </div>
                  <div className="w-full bg-slate-950 h-3.5 rounded-full overflow-hidden p-0.5 border border-slate-800">
                    <div 
                      className={`h-full rounded-full bg-gradient-to-r ${RANKS[level - 1].color} transition-all duration-500 shadow-[0_0_12px_rgba(99,102,241,0.3)]`}
                      style={{ width: `${calcProgressPercent()}%` }}
                    ></div>
                  </div>
                  <div className="flex justify-between text-[11px] text-slate-500 mt-2 font-medium">
                    <span>Rank {level} ({xp % 100} / 100 XP)</span>
                    <span>{level < 5 ? `Next Rank: ${RANKS[level].name}` : 'Max Rank Reached!'}</span>
                  </div>
                </div>
              )}

              <div className={`relative bg-slate-900 border border-slate-800 shadow-2xl rounded-2xl sm:rounded-3xl p-4 sm:p-10 transition-all ${shakeActive ? 'animate-shake border-red-500 shadow-red-500/10' : 'hover:border-indigo-500/30'}`}>
                
                <div className="absolute top-4 right-4 sm:right-6 flex items-center gap-2">
                  <span className="inline-block w-2.5 h-2.5 bg-emerald-500 rounded-full animate-ping"></span>
                  <span className="hidden min-[360px]:inline text-[11px] text-emerald-400 tracking-wider uppercase font-bold">Quest Active</span>
                </div>

                <div className="text-center mb-6">
                  <span className="text-xs font-bold uppercase tracking-widest text-slate-500 bg-slate-950 border border-slate-800 px-3 py-1 rounded-full">
                    {gameMode === 'adventure' ? `Quest Level ${level}` : `Practice Practice Mode`}
                  </span>
                </div>

                {loadingProgress ? (
                  <div className="flex flex-col items-center justify-center py-16">
                    <svg className="animate-spin h-10 w-10 text-indigo-500 mb-4" viewBox="0 0 24 24" fill="none">
                      <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
                      <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" />
                    </svg>
                    <p className="text-slate-400 font-bold text-sm tracking-wider heading-font">Retrieving Spell Deck Profile...</p>
                  </div>
                ) : currentProblem ? (
                  <div className="flex flex-col items-center justify-center my-5 sm:my-6 md:my-10">
                    <div className="flex items-center justify-center flex-wrap gap-3 sm:gap-4 md:gap-8 text-[clamp(2.5rem,12vw,4.5rem)] md:text-7xl font-extrabold heading-font select-none tracking-tight">
                      <span className="bg-gradient-to-b from-white to-slate-300 bg-clip-text text-transparent">{currentProblem.num1}</span>
                      <span className="text-indigo-400 scale-95">
                        {currentProblem.op === '+' && '+'}
                        {currentProblem.op === '-' && '-'}
                        {currentProblem.op === '*' && '×'}
                        {currentProblem.op === '/' && '÷'}
                      </span>
                      <span className="bg-gradient-to-b from-white to-slate-300 bg-clip-text text-transparent">{currentProblem.num2}</span>
                      <span className="text-slate-400 font-medium scale-90">=</span>
                      
                      <input 
                        ref={inputRef}
                        type="text"
                        inputMode="none"
                        pattern="[0-9]*"
                        placeholder="?"
                        value={userAnswer}
                        readOnly
                        disabled={feedback && feedback.status !== null}
                        aria-label="Answer"
                        className={`w-[clamp(7.25rem,34vw,11rem)] px-3 py-2 text-center rounded-2xl bg-slate-950 border text-slate-100 font-extrabold leading-none focus:outline-none focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all ${
                          feedback?.status === 'success' ? 'border-emerald-500 text-emerald-400 ring-4 ring-emerald-500/10' :
                          feedback?.status === 'error' ? 'border-rose-500 text-rose-400 ring-4 ring-rose-500/10' :
                          'border-slate-700 hover:border-slate-600'
                        }`}
                      />
                    </div>
                  </div>
                ) : null}

                {!loadingProgress && (
                  <div className="mt-6 max-w-sm mx-auto">
                    <div className="grid grid-cols-3 gap-2 sm:gap-3">
                      {['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(value => (
                        <button
                          key={value}
                          type="button"
                          onClick={() => handleAnswerInput(value)}
                          disabled={feedback && feedback.status !== null}
                          className={`active-scale min-h-14 rounded-2xl border text-slate-100 text-xl font-extrabold disabled:opacity-50 disabled:cursor-not-allowed transition-all ${
                            activePadKey === value
                              ? 'bg-indigo-600 border-indigo-400 shadow-lg shadow-indigo-500/20'
                              : 'bg-slate-950 border-slate-800 hover:border-slate-700'
                          }`}
                        >
                          {value}
                        </button>
                      ))}
                      <button
                        type="button"
                        disabled
                        aria-hidden="true"
                        className="min-h-14 rounded-2xl opacity-0 pointer-events-none"
                      ></button>
                      <button
                        type="button"
                        onClick={() => handleAnswerInput('0')}
                        disabled={feedback && feedback.status !== null}
                        className={`active-scale min-h-14 rounded-2xl border text-slate-100 text-xl font-extrabold disabled:opacity-50 disabled:cursor-not-allowed transition-all ${
                          activePadKey === '0'
                            ? 'bg-indigo-600 border-indigo-400 shadow-lg shadow-indigo-500/20'
                            : 'bg-slate-950 border-slate-800 hover:border-slate-700'
                        }`}
                      >
                        0
                      </button>
                      <button
                        type="button"
                        onClick={() => handleAnswerInput('BACKSPACE')}
                        disabled={feedback && feedback.status !== null}
                        aria-label="Backspace"
                        title="Backspace"
                        className={`active-scale min-h-14 rounded-2xl border text-rose-300 text-xl font-extrabold disabled:opacity-50 disabled:cursor-not-allowed transition-all flex items-center justify-center ${
                          activePadKey === 'BACKSPACE'
                            ? 'bg-rose-700 border-rose-400 shadow-lg shadow-rose-500/20'
                            : 'bg-rose-950/60 border-rose-900/30 hover:bg-rose-900/40'
                        }`}
                      >
                        <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20 6H9l-5 6 5 6h11a2 2 0 002-2V8a2 2 0 00-2-2zM12 10l4 4m0-4l-4 4" />
                        </svg>
                      </button>
                    </div>

                    <div className="mt-4">
                      {feedback && feedback.status ? (
                        <button
                          onClick={nextProblem}
                          className="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 active:scale-95 transition-all py-4 px-6 rounded-2xl font-bold tracking-wide shadow-lg shadow-indigo-500/20 flex items-center justify-center gap-2"
                        >
                          <span>Next Quest{continueCountdown !== null ? ` (${continueCountdown})` : ''}</span>
                          <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>
                        </button>
                      ) : (
                        <button
                          onClick={checkAnswer}
                          className="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 active:scale-95 transition-all py-4 px-6 rounded-2xl font-bold tracking-wide shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2"
                        >
                          <span>Verify Spell</span>
                          <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        </button>
                      )}
                    </div>
                  </div>
                )}

                {feedback && (
                  <div className={`mt-8 p-5 rounded-2xl border transition-all duration-300 ${
                    feedback.status === 'success' 
                      ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300' 
                      : 'bg-rose-500/10 border-rose-500/30 text-rose-300'
                  }`}>
                    <h4 className="text-md font-bold heading-font flex items-center gap-2 mb-1.5">
                      {feedback.status === 'success' ? (
                        <span>🎉 Perfect Cast!</span>
                      ) : (
                        <span>⚡ Miscast! Hint Recalled:</span>
                      )}
                    </h4>
                    <p className="text-xs sm:text-sm font-semibold opacity-90">{feedback.text}</p>
                    
                    {feedback.hint && (
                      <div className="mt-4 pt-4 border-t border-rose-500/20 bg-slate-950/60 p-4 rounded-xl text-slate-300 text-xs sm:text-sm whitespace-pre-line leading-relaxed font-mono">
                        {feedback.hint}
                      </div>
                    )}
                  </div>
                )}
              </div>

            </section>

            {/* Sidebar Content */}
            <section className="lg:col-span-4 flex flex-col gap-5 sm:gap-6 w-full">
              
              <div className="bg-slate-900 border border-slate-800 rounded-2xl sm:rounded-3xl p-4 sm:p-5 shadow-lg relative overflow-hidden">
                <div className="flex justify-between items-start mb-3">
                  <div>
                    <h3 className="text-sm font-extrabold uppercase tracking-wider text-slate-300 heading-font">Daily Quest Goal</h3>
                    <p className="text-[11px] text-slate-500 font-medium">Earn XP to achieve total focus</p>
                  </div>
                  <span className="text-2xl">🏆</span>
                </div>
                <div className="w-full bg-slate-950 h-3 rounded-full overflow-hidden p-0.5 border border-slate-800">
                  <div 
                    className="h-full rounded-full bg-gradient-to-r from-indigo-500 to-purple-500"
                    style={{ width: `${Math.min((xp / dailyGoalMax) * 100, 100)}%` }}
                  ></div>
                </div>
                <div className="flex justify-between text-[11px] mt-2 font-bold text-slate-400">
                  <span>{xp} XP Earned</span>
                  <span>Goal: {dailyGoalMax} XP</span>
                </div>
              </div>

              {gameMode === 'practice' && (
                <div className="bg-slate-900 border border-indigo-500/20 shadow-lg rounded-2xl sm:rounded-3xl p-4 sm:p-5">
                  <h3 className="text-md font-bold heading-font text-indigo-400 mb-4">⚙️ Custom Spell Config</h3>
                  
                  <div className="mb-5">
                    <span className="text-xs text-slate-400 font-bold block mb-2 uppercase">Select Operators</span>
                    <div className="grid grid-cols-2 gap-2">
                      {[
                        { key: '+', label: 'Addition' },
                        { key: '-', label: 'Subtraction' },
                        { key: '*', label: 'Multiplication' },
                        { key: '/', label: 'Division' }
                      ].map(opObj => (
                        <button
                          key={opObj.key}
                          onClick={() => {
                            playSound('click', isMuted);
                            setPracticeOps(prev => {
                              const updated = { ...prev, [opObj.key]: !prev[opObj.key] };
                              if (Object.values(updated).every(v => v === false)) return prev;
                              return updated;
                            });
                          }}
                          className={`py-2 px-3 rounded-xl text-xs font-extrabold border transition-all text-left flex items-center justify-between ${
                            practiceOps[opObj.key]
                              ? 'bg-indigo-600/10 border-indigo-500 text-indigo-300'
                              : 'bg-slate-950 border-slate-800 text-slate-400'
                          }`}
                        >
                          <span>{opObj.label}</span>
                          <span className="font-mono text-xs">{opObj.key === '*' ? '×' : opObj.key === '/' ? '÷' : opObj.key}</span>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <span className="text-xs text-slate-400 font-bold flex justify-between uppercase mb-2">
                      <span>Digit Difficulty</span>
                      <span className="text-indigo-400 font-mono">Tier {practiceLevel}</span>
                    </span>
                    <div className="space-y-3 bg-slate-950 p-3.5 rounded-2xl border border-slate-800">
                      <div className="flex justify-between text-[11px] font-bold text-slate-400">
                        {[1, 2, 3, 4, 5].map((lvl) => (
                          <button 
                            key={lvl}
                            onClick={() => setPracticeLevel(lvl)} 
                            className={`px-2.5 py-1 rounded-lg ${practiceLevel === lvl ? 'bg-indigo-600 text-white' : 'hover:bg-slate-900'}`}
                          >
                            Lvl {lvl}
                          </button>
                        ))}
                      </div>
                      <p className="text-[10px] text-slate-500 leading-relaxed font-semibold italic text-center">
                        {practiceLevel === 1 && "Simple single digit basics (e.g. 5 + 8)"}
                        {practiceLevel === 2 && "Double digit introduction, simpler calculations"}
                        {practiceLevel === 3 && "Full double digits & basic multiplication/division"}
                        {practiceLevel === 4 && "Sorcerer level: Carrying, borrowing, larger multipliers"}
                        {practiceLevel === 5 && "Grandmaster tier: Double/triple-digit mastery puzzles"}
                      </p>
                    </div>
                  </div>
                </div>
              )}

              <div className="bg-slate-900 border border-slate-800 shadow-lg rounded-2xl sm:rounded-3xl p-4 sm:p-5">
                <h3 className="text-md font-bold heading-font text-slate-300 mb-4">🏆 Alchemist Achievements</h3>
                <div className="grid grid-cols-1 gap-2.5">
                  {badgeList.map(badge => (
                    <div 
                      key={badge.id}
                      className={`p-3.5 rounded-2xl border transition-all flex items-center gap-3.5 ${
                        badge.unlocked 
                          ? 'bg-indigo-600/5 border-indigo-500/20' 
                          : 'bg-slate-950/50 border-slate-900 opacity-40'
                      }`}
                    >
                      <div className="text-2xl select-none">{badge.unlocked ? badge.title.split(' ')[1] || '🎖️' : '🔒'}</div>
                      <div className="flex-1">
                        <h4 className="text-xs font-bold text-slate-200">{badge.unlocked ? badge.title : 'Locked Badge'}</h4>
                        <p className="text-[10px] text-slate-400 font-semibold mt-0.5 leading-snug">{badge.desc}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="bg-slate-900 border border-slate-800 shadow-lg rounded-2xl sm:rounded-3xl p-4 sm:p-5 text-xs">
                <h3 className="text-md font-bold heading-font text-slate-300 mb-4">📊 Battle Statistics</h3>
                <div className="grid grid-cols-2 gap-3 mb-4">
                  <div className="bg-slate-950 p-3 rounded-2xl border border-slate-800 text-center">
                    <span className="block text-slate-500 font-bold uppercase text-[9px] mb-1">Solved Quest</span>
                    <span className="text-lg font-black heading-font text-slate-200">{solvedHistory.total}</span>
                  </div>
                  <div className="bg-slate-950 p-3 rounded-2xl border border-slate-800 text-center">
                    <span className="block text-slate-500 font-bold uppercase text-[9px] mb-1">Accuracy</span>
                    <span className="text-lg font-black heading-font text-indigo-400">
                      {solvedHistory.total > 0 
                        ? `${Math.round((solvedHistory.correct / solvedHistory.total) * 100)}%` 
                        : '100%'}
                    </span>
                  </div>
                </div>

                <div className="space-y-2 bg-slate-950 p-3 rounded-2xl border border-slate-800">
                  <span className="block text-[9px] font-bold uppercase tracking-wider text-slate-500 mb-1">Casts by Operator</span>
                  {['+', '-', '*', '/'].map(op => {
                    const count = solvedHistory.ops[op] || 0;
                    return (
                      <div key={op} className="flex justify-between items-center text-[11px] font-bold">
                        <span className="text-slate-400 flex items-center gap-1.5">
                          <span className="w-4 h-4 rounded-md bg-slate-900 border border-slate-800 flex items-center justify-center font-mono text-[9px]">
                            {op === '*' ? '×' : op === '/' ? '÷' : op}
                          </span>
                          {op === '+' && 'Addition'}
                          {op === '-' && 'Subtraction'}
                          {op === '*' && 'Multiplication'}
                          {op === '/' && 'Division'}
                        </span>
                        <span className="text-indigo-300">{count} Correct</span>
                      </div>
                    );
                  })}
                </div>
              </div>

            </section>
          </main>

          <footer className="border-t border-slate-900 bg-slate-950 py-4 px-6 text-center text-[11px] text-slate-500 font-semibold tracking-wide">
            <p>⚡ QuestiMath v{APP_VERSION} • GPL 2.0 • Author: Mike Lopez &lt;e@mikelopez.com&gt;</p>
            <p className="mt-1">Keyboard controls • Cloud synced and offline capable</p>
          </footer>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
